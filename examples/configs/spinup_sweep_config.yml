# This configuration demonstrates a parameter sweep with a spin-up stage.
# The scenario is as follows:
# 1. For each melt factor (`mu`) in the sweep, a glacier is run to steady
#    state (500 years) under a stable climate (T0 = 7.0 C).
# 2. The resulting steady-state profile is then used as the initial condition
#    for a 100-year transient run where the climate is 1.0 C warmer (T0 = 8.0 C).
# This allows studying how glaciers with different sensitivities (`mu`) respond
# to the same climate forcing.

# --- Spinup Configuration ---
# Parameters here override `base_parameters` for the spin-up stage only.
spinup:
  enabled: true
  config:
    # Run for 500 years to reach steady state
    tf: 500
  forcing:
    # Use a stable climate for the spin-up.
    T0: 7.0

# --- Base Parameters for the Main "Experiment" Run ---
base_parameters:
  config:
    ts: 0
    tf: 100 # Main run is a 100-year experiment
    delx: 25
    delt: 0.0015625
    deltout: 1.0
    min_thick: 1.0
  
  geometry:
    function: 'flowline.geometry.create_uniform_slope'
    parameters:
      bed_characteristic_length: 10000
      domain_extent: 12000
      x_gr_points: 61
      width: 1000
      elevation_drop: 1000

    # NOTE: The 'profile' key is ignored if spinup is enabled because
    # the spinup generates the initial profile for each run.

  forcing:
    mode: 'TP'
    P0: 2.0
    # The main run uses a warmer climate.
    T0: 8.0
    # The melt factor `mu` is a swept parameter, so a default isn't needed here.

# --- Sweep Parameters ---
# These parameters are applied to BOTH the spin-up and main runs.
# Here, we sweep over the melt sensitivity factor `mu`.
sweep_parameters:
  forcing.mu: [0.4, 0.5, 0.6, 0.7]
