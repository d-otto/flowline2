# Example configuration for a parameter sweep.

# --- Spinup Configuration ---
# Optional section to perform a spin-up run before the main simulation.
# If enabled, a steady-state run is performed first, and its resulting
# ice profile is used as the initial condition for the main run.
# Parameters defined here override `base_parameters` for the spin-up stage.
spinup:
  enabled: true
  config:
    # Run for 500 years to reach steady state
    tf: 500
  forcing:
    # Use a stable climate for the spin-up.
    # NOTE: If 'T0' is a sweep parameter, the swept value will override this.
    T0: 7.0

# --- Base Parameters ---
# These parameters are constant for all runs in the sweep, unless overridden
# in the sweep_parameters section.
base_parameters:
  config:
    ts: 0
    tf: 100 # Main run is a 100-year experiment
    delx: 25
    delt: 0.0015625  # 0.0125/8
    #delt: 0.00078125 # 0.0125/16
    deltout: 1.0
    min_thick: 1.0
  
  geometry:
    function: 'flowline.geometry.create_uniform_slope'
    parameters:
      bed_characteristic_length: 10000
      domain_extent: 12000
      x_gr_points: 61
      width: 1000
      elevation_drop: 1000

    # NOTE: The 'profile' key is not needed here if spinup is enabled,
    # as the spinup will generate the initial profile for each run.

  forcing:
    mode: 'TP' # Can be 'TP' (TemperaturePrecipitation) or 'b' (DirectMassBalance)
    P0: 2.0
    # The main run might have a different climate (e.g., warmer)
    T0: 8.5

# --- Sweep Parameters ---
# Define the parameters to sweep over. The script will generate a run for
# every combination of the values in these lists.
# Use dot notation to access nested parameters.
# These parameters are applied to BOTH the spin-up and main runs.
sweep_parameters:
  #forcing.mu: [0.40, 0.50, 0.60, 0.70]
  #geometry.parameters.elevation_drop: [900, 1000, 1100]
  #forcing.gamma: [0.004, 0.005, 0.006, 0.007, 0.008]
  forcing.T0: [7.0, 7.2., 7.4, 7.6, 7.8, 8.0, 8.2, 8.4, 8.6, 8.8, 9.0]
